[project]
name = "localdevin"
version = "0.1.0"
description = "Devin AI workflow reproduced locally with Qwen3.6 + OpenHands + Aider"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "gitpython>=3.1",
    "PyGithub>=2.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "tree-sitter>=0.23",
    "tree-sitter-languages>=1.10",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "slack-bolt>=1.18",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
localdevin = "cli.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "llm*", "tools*", "memory*", "review*", "insights*", "integrations*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
